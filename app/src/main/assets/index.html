<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102632">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'">
<title>PocketSVE</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="battle.css"><link rel="stylesheet" href="selection.css">
</head>
<body>
<main id="scene" class="scene" aria-label="对战界面">
<div id="battle-background" class="battle-background"></div>
<img id="leader-art" class="leader-art" alt="我方主战者">
<div id="battle-content" class="battle-content">
<section id="blood-region" class="blood-region" aria-label="双方生命值">
<button class="original-button menu-button" id="menu-button" aria-label="打开对战菜单"><img src="ui/role_btn_menu_off.png" alt=""></button>
<div class="life-counters">
<div class="life-panel opponent" data-side="opponent" aria-label="对手生命">
<button class="life-adjust" data-life="opponent" data-delta="-1" aria-label="对手生命减一"><img src="ui/btn_minus.png" alt=""></button>
<button class="life-value" id="opponent-hp" data-set-life="opponent" aria-label="设置对手生命值"></button>
<button class="life-adjust" data-life="opponent" data-delta="1" aria-label="对手生命加一"><img src="ui/btn_plus.png" alt=""></button>
</div>
<div class="life-panel you" data-side="you" aria-label="我方生命">
<button class="life-adjust" data-life="you" data-delta="-1" aria-label="我方生命减一"><img src="ui/btn_minus.png" alt=""></button>
<button class="life-value" id="you-hp" data-set-life="you" aria-label="设置我方生命值"></button>
<button class="life-adjust" data-life="you" data-delta="1" aria-label="我方生命加一"><img src="ui/btn_plus.png" alt=""></button>
</div><div id="battle-message" class="battle-message" hidden></div></div>
<button class="original-button reset-button" id="reset-button" aria-label="重新开始对战"><img src="ui/btn_restart_off.png" alt=""></button>
</section>
<section id="stars" class="stars" aria-label="PP上限"><div class="stars-inner">
<button id="max-pp-plus" class="star-adjust" aria-label="PP上限加一"><img src="ui/btn_plus.png" alt=""></button>
<div id="pp-pips" class="pp-pips"></div>
<button id="max-pp-minus" class="star-adjust" aria-label="PP上限减一"><img src="ui/btn_minus.png" alt=""></button>
</div></section>
<section id="bottom-controls" class="bottom-controls" aria-label="对战操作">
<div class="pp-control">
<button id="pp-plus" class="original-button pp-arrow" aria-label="可用PP加一"><img src="ui/btn_pp_plus.png" alt=""></button>
<div class="pp-number-panel"><img class="pp-logo" src="ui/battle_pp.png" alt="PP"><span id="pp-current" class="pp-current" aria-label="可用PP"></span><span class="pp-divider"></span><span id="pp-max" class="pp-max" aria-label="PP上限"></span></div>
<button id="pp-minus" class="original-button pp-arrow" aria-label="可用PP减一"><img src="ui/btn_pp_minus.png" alt=""></button>
<button id="turn-button" class="original-button turn-start" aria-label="回合开始"><img src="ui/battle_btn_turn_start_off.png" alt=""><span>回合<br>开始</span></button>
</div>
<div class="right-actions">
<div id="emote-region" class="emote-region">
<div id="emote-tray" class="emote-tray" hidden></div>
<button class="original-button emote-toggle" id="emote-button" aria-label="表情"><img src="ui/emote_btn_emote_menu_r_off.png" alt=""></button>
</div>
<div class="action-row">
<button id="dice-button" class="original-button action-button" aria-label="掷骰子"><img src="ui/battle_btn_dice_off.png" alt=""></button>
<button id="end-turn-button" class="original-button action-button" aria-label="回合结束"><img src="ui/battle_btn_turn_end_off.png" alt=""><span>结束</span></button>
</div></div>
</section></div></main>
<div id="modal" class="modal-backdrop" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
<header class="modal-header"><h1 id="modal-title"></h1><button id="modal-close" class="close-button" aria-label="关闭">×</button></header><div id="modal-body" class="modal-body"></div>
</section></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="catalog.js"></script><script src="leader-lines.js"></script><script src="core.js"></script><script src="selection.js"></script><script src="app.js"></script>
</body></html>
